name: HACS

on:
  pull_request:
  push:
    branches: [main]
  schedule:
    - cron: "0 6 * * 1"

permissions:
  contents: read

jobs:
  validate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: hacs/action@main
        with:
          category: integration
          # license: PolyForm Noncommercial is in LICENSE.md but GitHub cannot
          # auto-detect it (SPDX NOASSERTION), so the check would never pass
          ignore: brands license
